<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Workout Complete!</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <main
      class="min-h-screen flex flex-col items-center justify-center px-6 text-center"
    >
      <!-- Animated Icon Container -->
      <div class="mb-8 relative">
        <div
          class="absolute inset-0 bg-blue-500/20 blur-3xl rounded-full"
        ></div>
        <div
          class="relative bg-slate-900 border border-slate-800 p-8 rounded-full shadow-2xl"
        >
          <svg
            class="w-16 h-16 text-emerald-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        </div>
      </div>

      <!-- Motivational Content -->
      <h1 class="text-4xl font-black italic mb-4 tracking-tight uppercase">
        Session <span class="text-blue-500">Crushed</span>
      </h1>

      <div class="max-w-sm space-y-4 mb-12">
        <p class="text-xl text-slate-300 font-medium">
          "Consistency beats perfection."
        </p>
        <p class="text-slate-500 text-sm italic leading-relaxed">
          You showed up today, and that's the hardest part. Every rep is a
          deposit into your future self.
        </p>
      </div>

      <!-- Navigation -->
      <div class="w-full max-w-xs space-y-4">
        <a
          href="index.html"
          class="block w-full py-4 bg-white text-slate-950 font-black rounded-2xl transition-all hover:scale-[1.02] active:scale-95 shadow-xl shadow-white/5"
        >
          GO TO DASHBOARD
        </a>

        <p class="text-xs text-slate-600 uppercase tracking-widest font-bold">
          See you tomorrow, Habibi
        </p>
      </div>
    </main>
  </body>
</html>
